<button class="lang-btn" (click)="switchLanguage()" [title]="langService.currentLang === 'ar' ? 'Switch to English' : 'التحويل إلى العربية'">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" class="lang-icon">
    <circle cx="10" cy="10" r="8" />
    <path d="M10 2a14 14 0 0 1 0 16M2 10h16" />
  </svg>
  <span class="lang-text">{{ langService.currentLang === 'ar' ? 'English' : 'العربية' }}</span>
</button>
